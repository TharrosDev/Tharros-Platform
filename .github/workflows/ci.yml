name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Integration suites share one dedicated test Supabase project. Serialize every
# run so fixtures from a PR run cannot race a push-to-main run.
concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (deterministic unit suites)
        run: pnpm --filter @tharros/web test:unit

      # A paused/deleted test project or transient DNS outage must not hide the
      # deterministic source checks. When Supabase is reachable, the full live
      # RLS/integration suite remains a hard gate and any test failure still fails.
      - name: Check test database availability
        id: supabase
        shell: bash
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TEST_SUPABASE_URL is not configured; live integration tests will be skipped."
            exit 0
          fi

          host="$(node -e 'console.log(new URL(process.env.TEST_SUPABASE_URL).hostname)')"
          if getent ahosts "$host" >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dedicated Supabase test project is unreachable ($host); live integration tests will be skipped. Restore the test dependency before release."
          fi

      - name: Test (RLS + live integration)
        if: steps.supabase.outputs.reachable == 'true'
        run: pnpm --filter @tharros/web test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}

      - name: Record skipped integration suite
        if: steps.supabase.outputs.reachable != 'true'
        run: |
          echo "### Live integration suite skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The dedicated Supabase test project could not be resolved/reached. Typecheck, lint, deterministic unit tests, and production build still ran. This dependency must be restored before release." >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}

  e2e:
    name: e2e (playwright auth+billing spine)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check test database availability
        id: supabase
        shell: bash
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TEST_SUPABASE_URL is not configured; browser integration tests will be skipped."
            exit 0
          fi

          host="$(node -e 'console.log(new URL(process.env.TEST_SUPABASE_URL).hostname)')"
          if getent ahosts "$host" >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dedicated Supabase test project is unreachable ($host); browser integration tests will be skipped."
          fi

      - name: Install Playwright browser
        if: steps.supabase.outputs.reachable == 'true'
        run: pnpm --filter @tharros/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: E2E (Playwright)
        if: steps.supabase.outputs.reachable == 'true'
        run: pnpm --filter @tharros/web test:e2e
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: "re_e2e_placeholder"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_PRICE_GROWTH: ${{ secrets.STRIPE_TEST_PRICE_GROWTH }}

      - name: Record skipped browser integration suite
        if: steps.supabase.outputs.reachable != 'true'
        run: |
          echo "### Browser integration suite skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The dedicated Supabase test project could not be resolved/reached. The production build still ran. Restore the dependency before release." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.supabase.outputs.reachable == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
