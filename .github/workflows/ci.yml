# Day 14 — CI pipeline.
# Quality gate for every PR and every push to main: typecheck + lint + the
# Vitest RLS/org isolation harness + a production build. Branch protection
# (configured in repo settings) requires this check to pass before merge.
#
# The Vitest harness does real Supabase round-trips (it signs up + tears down
# auth users), so it runs against a DEDICATED test project — never prod.
# See docs/CI.md for the secrets this workflow expects.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI shares ONE dedicated test Supabase project, so only one run may touch it at
# a time. The group is workflow-wide (NOT per-ref) so a PR run and the subsequent
# push-to-main run serialize instead of racing — concurrent runs otherwise clobber
# each other's rows (the global `jobs` harness wipes the whole table in beforeEach,
# which once deleted another run's in-flight job → "cannot coerce ... single object").
# Queue rather than cancel-in-progress so an in-flight run always finishes its
# teardown cleanly and never leaves half-written state behind.
concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.5 requires Node >= 22.13 (it imports node:sqlite).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # DB-touching suite. Points at the test Supabase project; the harness
      # seeds + tears down its own users, so runs are self-cleaning.
      - name: Test (RLS + org isolation harness)
        run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}

      # Production build. Env validation is skipped here (the secrets that gate
      # it live in Vercel, not CI); the public Supabase test values are supplied
      # so any build-time client construction resolves.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}

  # Day 22 — Playwright auth+billing E2E spine. Separate job so a browser run
  # never slows the fast quality gate above. Builds the app, boots it with
  # `next start` (Playwright's webServer), and drives the real UI against the
  # dedicated TEST Supabase project (signup → onboard → invite → gate →
  # subscribe-loads → active → cancel). Subscription state is seeded service-side
  # (mirrors the Day-18 webhook) so there's no flaky Stripe iframe to complete.
  # Stripe test keys are optional — without them the checkout container still
  # mounts; with them the embedded iframe loads too. See docs/CI.md.
  e2e:
    name: e2e (playwright auth+billing spine)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @tharros/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          # NEXT_PUBLIC_* are inlined at build time — supply the Stripe test
          # publishable key here too so the embedded checkout can actually load.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: E2E (Playwright)
        run: pnpm --filter @tharros/web test:e2e
        env:
          # App env the running server + the spec's service-role helpers read.
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          # Invite email is allowed to fail (the spine reads the token from the DB).
          RESEND_API_KEY: "re_e2e_placeholder"
          # Stripe TEST keys — optional; enable the embedded-checkout-loads assertion.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_PRICE_GROWTH: ${{ secrets.STRIPE_TEST_PRICE_GROWTH }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
